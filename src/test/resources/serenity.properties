# Browser
webdriver.driver=chrome

# Run Chrome in Headless Mode (Jenkins)
chrome.switches=--headless=new;--disable-gpu;--window-size=1920,1080;--no-sandbox;--disable-dev-shm-usage

# Project
serenity.project.name=GoRest Serenity BDD Framework

# Reporting
serenity.take.screenshots=FOR_FAILURES
serenity.console.colors=true
serenity.logging=VERBOSE

# Execution
serenity.restart.browser.for.each=never

# Timeouts
webdriver.wait.for.timeout=30000

# Optional
serenity.report.encoding=UTF-8